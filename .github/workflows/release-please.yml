name: Release

on:
  push:
    branches:
      - "master"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          release-type: simple
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
