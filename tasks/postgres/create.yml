- name: Recreate local postgres database
  delegate_to: localhost
  become: false
  ansible.builtin.shell: >
    {{ db_pull_postgresql_createdb_binary_path }} \
      -U {{ db_pull_local_database_user }} \
      -h {{ db_pull_local_database_host }} \
      -p {{ db_pull_local_database_port }} \
      {{ db_pull_local_database_name }}
  environment:
    PGPASSWORD: "{{ db_pull_local_database_password }}"
  no_log: true
